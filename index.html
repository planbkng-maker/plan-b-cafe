<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<script>
function showFatalError(msg){
  var el = document.getElementById('fatalErrorBox');
  if(!el){
    el = document.createElement('div');
    el.id = 'fatalErrorBox';
    el.style.cssText = 'position:fixed;top:0;right:0;left:0;z-index:9999;background:#B4483B;color:#fff;padding:14px 16px;font-family:sans-serif;font-size:13px;line-height:1.6;direction:rtl;text-align:right;box-shadow:0 4px 12px rgba(0,0,0,.3);';
    document.body ? document.body.prepend(el) : window.addEventListener('DOMContentLoaded', ()=>document.body.prepend(el));
  }
  el.textContent = '⚠️ خطا: ' + msg;
}
window.addEventListener('error', function(e){ showFatalError(e.message + ' (خط ' + e.lineno + ')'); });
window.addEventListener('unhandledrejection', function(e){ showFatalError((e.reason && e.reason.message) ? e.reason.message : String(e.reason)); });
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>PLAN B | منو</title>
<link rel="stylesheet" href="styles.css">
<style>
/* ---------- استایل‌های اختصاصی صفحه‌ی اصلی ---------- */
body{ padding-bottom:90px; }

/* Splash */
#splash{
  position:fixed; inset:0; z-index:100; background:var(--pistachio-deep);
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px;
  transition:transform .9s cubic-bezier(.76,0,.24,1), opacity .7s ease;
}
#splash.hide{ transform:translateY(-100%); opacity:0; pointer-events:none; }

/* ---------- لوگوی PLAN B (یک SVG ساده، بدون وابستگی به فونت اینترنتی) ---------- */
.brand-logo{ color:var(--sand); display:block; }
.brand-logo .lg-text{ font-family:var(--font-logo); }
.brand-logo.animated .lg-text{
  opacity:0; transform-box:fill-box; transform-origin:center; transform:translateY(-16px) scale(.92);
  animation:logoPop .8s cubic-bezier(.22,1.4,.36,1) forwards .15s;
}
.brand-logo.animated .lg-line{ stroke-dasharray:150; stroke-dashoffset:150; animation:lineDraw .7s ease forwards .85s; }
.brand-logo.animated .lg-dot{
  opacity:0; transform-box:fill-box; transform-origin:center; transform:scale(0);
  animation:dotPop .5s cubic-bezier(.34,1.7,.5,1) forwards 1.4s;
}
@keyframes logoPop{ to{ opacity:1; transform:translateY(0) scale(1); } }
@keyframes lineDraw{ to{ stroke-dashoffset:0; } }
@keyframes dotPop{ to{ opacity:1; transform:scale(1); } }
.logo-splash{ width:min(72vw,260px); }
.logo-header{ width:118px; color:var(--pistachio-deep); margin:0 auto; }
.logo-hero{ width:180px; color:#fff; margin:0 auto; }

/* Header */
header.top{ padding:20px 20px 4px; text-align:center; cursor:pointer; }

.page{ display:none; animation:pageIn .4s ease; }
.page.active{ display:block; }
@keyframes pageIn{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);} }

/* ---------- صفحه‌ی خانه ---------- */
.hero-box{ position:relative; margin:14px 16px 0; border-radius:var(--radius); overflow:hidden; height:46vh; min-height:260px; background:var(--pistachio-pale); box-shadow:var(--shadow-3d); }
.hero-slide{
  position:absolute; inset:0; background-size:cover; background-position:center;
  opacity:0; transition:opacity 1s ease;
}
.hero-slide.active{ opacity:1; }
.hero-empty{ display:flex; align-items:center; justify-content:center; font-size:3rem; }
.hero-overlay{
  position:absolute; inset:0; z-index:2;
  background:linear-gradient(to top, rgba(59,55,41,.55), rgba(59,55,41,0) 55%);
  display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding-bottom:26px;
}
.hero-tagline{ color:var(--sand); font-size:.82rem; margin-top:4px; opacity:.9; }
.hero-dots{ position:absolute; bottom:10px; right:0; left:0; display:flex; justify-content:center; gap:6px; z-index:3; }
.hero-dot{ width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.5); }
.hero-dot.active{ background:#fff; width:16px; border-radius:4px; transition:all .3s ease; }

.home-actions{ padding:18px 20px 6px; display:flex; flex-direction:column; gap:12px; }
.open-status{ text-align:center; font-size:.8rem; color:var(--muted); padding-bottom:10px; }

/* ---------- صفحه‌ی انتخاب دسته‌بندی ---------- */
.page-head{ padding:8px 20px 4px; text-align:center; }
.page-head h2{ font-family:var(--font-logo); font-weight:700; font-style:italic; font-size:1.5rem; color:var(--pistachio-deep); }
.page-head p{ font-size:.78rem; color:var(--muted); margin-top:2px; }
.cat-index-list{ padding:16px; display:flex; flex-direction:column; gap:10px; }
.cat-index-btn{
  display:flex; align-items:center; justify-content:space-between;
  background:linear-gradient(155deg, var(--pistachio-light), var(--pistachio-deep) 75%); color:var(--sand);
  padding:18px 22px; border-radius:var(--radius-sm); font-weight:700; font-size:.94rem;
  box-shadow:var(--shadow-3d);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .3s ease;
}
.cat-index-btn:hover{ transform:translateY(-3px) rotate(-.3deg); }
.cat-index-btn:active{ transform:translateY(2px) scale(.98); box-shadow:var(--shadow-3d-press); }
.cat-index-en{ font-size:.72rem; font-weight:500; opacity:.75; font-family:var(--font-logo); }
.empty-note{ text-align:center; color:var(--muted); font-size:.85rem; padding:30px 20px; }

.touch-card{
  margin:18px 16px 6px; background:linear-gradient(160deg, var(--pistachio-light), var(--pistachio-deep) 80%); color:var(--sand);
  border-radius:var(--radius); padding:26px 20px; text-align:center; box-shadow:var(--shadow-3d);
}
.touch-card h4{ font-family:var(--font-logo); font-weight:700; font-style:italic; font-size:1.3rem; margin-bottom:6px; }
.touch-card p{ font-size:.8rem; color:var(--pistachio-pale); margin-bottom:14px; }
.touch-card .pill-btn{ background:var(--clay); }

/* ---------- صفحه‌ی فید آیتم‌ها ---------- */
.feed-header{
  position:sticky; top:0; z-index:20; background:var(--sand);
  padding:10px 14px 10px; display:flex; align-items:center; gap:10px;
  border-bottom:1px solid var(--sand-deep);
}
.back-btn{
  flex-shrink:0; width:40px; height:40px; border-radius:50%;
  background:linear-gradient(155deg, #fff, var(--sand-deep) 140%); color:var(--pistachio-deep);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 6px 14px -8px rgba(76,90,54,.4); transition:transform .2s ease;
}
.back-btn:active{ transform:scale(.92); }
.back-btn svg{ width:18px; height:18px; }
.feed-tabs{ display:flex; gap:8px; overflow-x:auto; }
.feed-tab{
  flex:0 0 auto; padding:10px 18px; border-radius:999px; font-size:.82rem; font-weight:600;
  background:var(--sand-deep); color:var(--pistachio-deep); box-shadow:0 3px 8px -4px rgba(76,90,54,.3); transition:all .3s ease;
}
.feed-tab.active{ background:linear-gradient(155deg, var(--pistachio-light), var(--pistachio-deep) 75%); color:var(--sand); box-shadow:var(--shadow-3d-press); }

#feedList{ padding:0 16px 20px; }
.feed-section{ padding-top:4px; }
.feed-card{
  background:linear-gradient(165deg, #fff, var(--sand-deep) 130%); border-radius:var(--radius); padding:20px 20px 18px;
  margin-bottom:16px; text-align:center; position:relative; box-shadow:var(--shadow-3d);
  animation:cardIn .5s ease both, floaty 5s ease-in-out 1s infinite;
  transition:transform .3s ease, box-shadow .3s ease;
}
.feed-card:hover{ transform:translateY(-4px); box-shadow:0 22px 34px -16px rgba(76,90,54,.5), inset 0 1px 0 rgba(255,255,255,.6); }
@keyframes cardIn{ from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);} }
@keyframes floaty{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
.feed-card:nth-child(even){ animation-duration:.5s, 6s; animation-delay:0s, 1.6s; }
.feed-new{ position:absolute; top:14px; left:14px; }
.feed-photo{ height:150px; display:flex; align-items:center; justify-content:center; margin-bottom:10px; }
.feed-photo img{ max-height:100%; border-radius:var(--radius-sm); object-fit:cover; box-shadow:0 14px 20px -10px rgba(76,90,54,.4); }
.feed-emoji{ font-size:3.4rem; }
.feed-sub{ font-size:.72rem; color:var(--muted); font-family:var(--font-logo); margin-bottom:2px; }
.feed-title{ font-size:1.02rem; margin-bottom:6px; color:var(--ink); }
.feed-desc{ font-size:.78rem; color:var(--muted); line-height:1.7; margin-bottom:12px; }

/* ---------- درباره‌ی ما ---------- */
.about-hero{
  background:linear-gradient(160deg, var(--pistachio-light), var(--pistachio-deep) 80%); color:var(--sand); border-radius:var(--radius);
  padding:34px 22px; margin:14px 16px 20px; text-align:center; position:relative; overflow:hidden; box-shadow:var(--shadow-3d);
}
.about-hero h2{ font-family:var(--font-logo); font-weight:700; font-style:italic; font-size:1.7rem; margin-bottom:10px; }
.about-hero p{ font-size:.86rem; color:var(--pistachio-pale); line-height:1.9; max-width:500px; margin:0 auto; }
.about-body{ padding:0 20px; }
.about-body p{ font-size:.9rem; line-height:2; color:#5c5842; margin-bottom:14px; }
.value-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; padding:6px 16px 24px; }
.value-card{ background:linear-gradient(165deg, #fff, var(--sand-deep) 140%); border-radius:var(--radius-sm); padding:18px 6px; text-align:center; box-shadow:var(--shadow-3d); transition:transform .3s ease; }
.value-card:hover{ transform:translateY(-3px); }
.value-card .ico{ font-size:1.5rem; margin-bottom:6px; }
.value-card .lbl{ font-size:.72rem; font-weight:700; color:var(--pistachio-deep); }

/* ---------- تماس با ما ---------- */
.contact-wrap{ padding:12px 16px 20px; }
.contact-card{
  background:linear-gradient(165deg, #fff, var(--sand-deep) 140%); border-radius:var(--radius); padding:20px; margin-bottom:14px;
  display:flex; align-items:center; gap:14px; box-shadow:var(--shadow-3d); transition:transform .3s ease;
}
.contact-card:hover{ transform:translateY(-2px); }
.contact-ico{
  width:44px; height:44px; border-radius:var(--radius-sm); background:linear-gradient(155deg, var(--pistachio-light), var(--pistachio)); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:1.1rem; flex-shrink:0; box-shadow:0 6px 12px -6px rgba(76,90,54,.5);
}
.contact-card .label{ font-size:.72rem; color:var(--muted); margin-bottom:2px; }
.contact-card .value{ font-weight:700; font-size:.9rem; }
.hours-table{ width:100%; border-collapse:collapse; }
.hours-table td{ padding:8px 4px; font-size:.82rem; border-bottom:1px dashed var(--sand); }
.hours-table td:last-child{ text-align:left; font-weight:700; color:var(--pistachio-deep); }
.social-row{ display:flex; gap:10px; margin-top:14px; }

/* ---------- نوار پایین ---------- */
nav.bottom{
  position:fixed; bottom:14px; right:14px; left:14px; z-index:50;
  background:linear-gradient(165deg, var(--pistachio-light), var(--pistachio-deep) 80%); border-radius:var(--radius); display:flex; padding:7px;
  box-shadow:0 18px 34px -14px rgba(59,55,41,.55), inset 0 1px 0 rgba(255,255,255,.25);
}
nav.bottom button{
  flex:1; color:var(--pistachio-pale); padding:11px 4px; border-radius:var(--radius-sm);
  font-size:.72rem; font-weight:600; display:flex; flex-direction:column; align-items:center; gap:3px;
  transition:all .35s cubic-bezier(.34,1.56,.64,1);
}
nav.bottom button .ic{ font-size:1.1rem; }
nav.bottom button.active{ background:rgba(255,255,255,.18); color:#fff; transform:translateY(-3px); box-shadow:inset 0 1px 0 rgba(255,255,255,.3); }

@media(min-width:720px){
  .page{ max-width:640px; margin:0 auto; }
  nav.bottom{ max-width:640px; margin:0 auto; }
}
</style>
</head>
<body>

<div id="splash">
  <svg class="brand-logo logo-splash animated" viewBox="0 0 220 80" xmlns="http://www.w3.org/2000/svg">
    <text class="lg-text" x="110" y="42" text-anchor="middle" font-style="italic" font-weight="700" font-size="34" letter-spacing="1" fill="currentColor">PLAN <tspan font-size="40">B</tspan></text>
    <line class="lg-line" x1="35" y1="58" x2="185" y2="58" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
    <circle class="lg-dot" cx="110" cy="58" r="3" fill="currentColor"/>
  </svg>
</div>

<header class="top" id="logoHome">
  <svg class="brand-logo logo-header" viewBox="0 0 220 80" xmlns="http://www.w3.org/2000/svg">
    <text x="110" y="42" text-anchor="middle" font-style="italic" font-weight="700" font-size="34" letter-spacing="1" fill="currentColor">PLAN <tspan font-size="40">B</tspan></text>
    <line x1="35" y1="58" x2="185" y2="58" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
    <circle cx="110" cy="58" r="3" fill="currentColor"/>
  </svg>
</header>

<!-- ============== صفحه‌ی خانه ============== -->
<section class="page active" id="page-home">
  <div class="hero-box">
    <div id="heroImages"></div>
    <div class="hero-overlay">
      <svg class="brand-logo logo-hero" id="homeCafeName" viewBox="0 0 220 80" xmlns="http://www.w3.org/2000/svg">
        <text x="110" y="42" text-anchor="middle" font-style="italic" font-weight="700" font-size="34" letter-spacing="1" fill="currentColor">PLAN <tspan font-size="40">B</tspan></text>
        <line x1="35" y1="58" x2="185" y2="58" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
        <circle cx="110" cy="58" r="3" fill="currentColor"/>
      </svg>
      <div class="hero-tagline" id="homeTagline"></div>
    </div>
    <div class="hero-dots" id="heroDots"></div>
  </div>
  <div class="home-actions">
    <button class="pill-btn" data-goto="categories">منو</button>
    <button class="pill-btn outline" data-goto="about">درباره‌ی ما</button>
    <button class="pill-btn outline" data-goto="contact">تماس با ما</button>
  </div>
  <div class="open-status" id="openStatus"></div>
</section>

<!-- ============== صفحه‌ی انتخاب دسته‌بندی ============== -->
<section class="page" id="page-categories">
  <div class="page-head">
    <h2>منوی دیجیتال</h2>
    <p>یک دسته‌بندی را انتخاب کن</p>
  </div>
  <div class="cat-index-list" id="categoriesList"></div>
  <div class="touch-card">
    <h4>در تماس باشید</h4>
    <p>اگر سوالی داری یا به کمک نیاز داری، تماس بگیر.</p>
    <a id="ctPhoneCall" class="pill-btn" href="tel:">تماس بگیر</a>
  </div>
</section>

<!-- ============== صفحه‌ی فید آیتم‌ها ============== -->
<section class="page" id="page-feed">
  <div class="feed-header">
    <span class="back-btn" id="feedBackBtn"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <div class="feed-tabs" id="feedTabs"></div>
  </div>
  <div id="feedList"></div>
</section>

<!-- ============== درباره‌ی ما ============== -->
<section class="page" id="page-about">
  <div class="about-hero">
    <h2 id="aboutTitle"></h2>
    <p id="aboutIntro"></p>
  </div>
  <div class="about-body" id="aboutBody"></div>
  <div class="value-grid" id="valueGrid"></div>
</section>

<!-- ============== تماس با ما ============== -->
<section class="page" id="page-contact">

  <div class="contact-wrap">
    <div class="contact-card">
      <div class="contact-ico">📍</div>
      <div><div class="label">آدرس</div><div class="value" id="cAddress"></div></div>
    </div>
    <div class="contact-card">
      <div class="contact-ico">📞</div>
      <div><div class="label">تلفن</div><div class="value"><a id="cPhoneVal" href="#"></a></div></div>
    </div>
    <div class="contact-card" style="align-items:flex-start;">
      <div class="contact-ico">🕒</div>
      <div style="flex:1;">
        <div class="label" style="margin-bottom:6px;">ساعات کاری</div>
        <table class="hours-table" id="hoursTable"></table>
      </div>

    <div class="social-row" id="socialRow"></div>
  </div>
</section>

<nav class="bottom">
  <button data-page="categories"><span class="ic">☰</span>منو</button>
  <button data-page="about"><span class="ic">🌵</span>درباره ما</button>
  <button data-page="contact"><span class="ic">☎</span>تماس با ما</button>
</nav>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="main.js"></script>
</body>
</html>
